name: CI

on:
  push:
    branches: ["**"]  # tags run this through release.yml instead
  pull_request:
  workflow_call:

jobs:
  test:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run tests (gcc, ASan + UBSan)
        run: make -C tests CC=gcc

      - name: Run tests (clang, ASan + UBSan)
        run: make -C tests clean test CC=clang

  font:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Doxygen
        run: |
          curl -sSL https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz | tar -xz
          echo "$PWD/doxygen-1.18.0/bin" >> "$GITHUB_PATH"

      - name: Regenerate font files and API docs
        run: |
          python tools/gen_font.py
          make docs
          rm -rf doxygen-1.18.0

      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain -- src/ docs/)" ]; then
            git status --short -- src/ docs/
            git diff -- src/ docs/
            echo "::error::Generated files are out of date. Run 'python tools/gen_font.py' and 'make docs' and commit the result."
            exit 1
          fi

  build:
    name: Build examples (CEdev)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up CE C/C++ toolchain
        uses: gavinhsmith/setup-ti84-ce-toolchain@v1.0.0

      - name: Build
        run: make

      - name: Build hardware tests
        run: make hw-build

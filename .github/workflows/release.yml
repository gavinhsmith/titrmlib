name: Release

# Pushing a version tag (e.g. v1.0.0) runs CI, then drafts a GitHub release
# with the files needed to build titrmlib into a CEdev project. Review the
# draft, add the changes, and publish it by hand.
on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Draft release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package
        run: |
          mkdir -p titrmlib/src
          cp src/*.c src/*.h titrmlib/src/
          cp LICENSE.md titrmlib/LICENSE.md
          cp tools/petabyt-font/LICENSE titrmlib/LICENSE-font.txt
          zip -r "titrmlib-$GITHUB_REF_NAME.zip" titrmlib

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Using titrmlib

          1. Unzip \`titrmlib-$GITHUB_REF_NAME.zip\` into your CEdev project's \`lib/\` folder, giving \`lib/titrmlib/\`.
          2. Add its sources to your project's makefile:

             \`\`\`make
             CFLAGS = -Wall -Wextra -Oz -Ilib/titrmlib/src
             EXTRA_C_SOURCES = \$(wildcard lib/titrmlib/src/*.c)
             \`\`\`

          3. \`#include "titrm.h"\` and build with \`make\`.

          Keep the library inside your project directory: on Windows, CEdev can't build sources reached through \`..\`. The calculator needs the [CE C libraries](https://github.com/CE-Programming/libraries/releases).

          API reference: https://gavinhsmith.github.io/titrmlib/
          NOTES
          gh release create "$GITHUB_REF_NAME" "titrmlib-$GITHUB_REF_NAME.zip" \
            --draft --title "$GITHUB_REF_NAME" --notes-file notes.md
